<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeCare Lite | Cadastro de Pacientes</title>
  <!-- Fonte moderna do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="topo">
    <div class="logo">
      <span class="icone-cruz">+</span>
      <div>
        <h1>LifeCare <span>Lite</span></h1>
        <p>Sistema Acadêmico de Cadastro de Pacientes</p>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (LAYOUT LADO A LADO) -->
  <main class="container">
    
    <!-- COLUNA DA ESQUERDA: FORMULÁRIO -->
    <section class="card form-card">
      <div class="card-titulo">
        <h2>Cadastro de Paciente</h2>
        <p>Preencha os campos abaixo para salvar o paciente.</p>
      </div>

      <form id="formPaciente">
        <div class="campo">
          <label for="nome">Nome Completo *</label>
          <input type="text" id="nome" placeholder="Ex: Maria dos Santos" required>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>
          </div>

          <div class="campo">
            <label for="nascimento">Data de Nascimento *</label>
            <input type="date" id="nascimento" required>
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="telefone">Telefone / Contato *</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999" required>
          </div>

          <div class="campo">
            <label for="alergias">Alergias ou Condições</label>
            <input type="text" id="alergias" placeholder="Ex: Dipirona, Nenhuma...">
          </div>
        </div>

        <div class="botoes-form">
          <button type="submit" id="btnSalvar" class="btn btn-primario">Cadastrar Paciente</button>
          <button type="button" id="btnCancelar" class="btn btn-secundario" style="display: none;">Cancelar Edição</button>
        </div>
      </form>
    </section>

    <!-- COLUNA DA DIREITA: LISTAGEM E BUSCA -->
    <section class="card tabela-card">
      <div class="card-topo-tabela">
        <div>
          <h2>Pacientes Cadastrados</h2>
          <p><span id="totalPacientes">0</span> paciente(s) na lista</p>
        </div>
        <div class="caixa-busca">
          <input type="text" id="campoBusca" placeholder="Buscar por nome ou CPF...">
        </div>
      </div>

      <div class="tabela-scroll">
        <table class="tabela-pacientes">
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th>Nascimento</th>
              <th>Alergias</th>
              <th style="text-align: right;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaPacientesCorpo">
            <!-- As linhas são inseridas dinamicamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- SCRIPT JAVASCRIPT SIMPLIFICADO -->
  <script src="app.js"></script>
</body>
</html>
