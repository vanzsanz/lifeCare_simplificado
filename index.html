<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codar.me - Vanilla ToDo</title>
    <link rel="stylesheet" href="srcstyle.css">
</head>
<body>
    <div class="app">
        <div class="form">
            <h1>Adicionar tarefa</h1>
            <form>
                <input 
                    class="tarefa" 
                    name="tarefa" 
                    id="tarefa" 
                    placeholder="Descrição da tarefa"
                />
                <button type="submit">Adicionar</button>
            </form>
        </div>
    </div>

    <div id="tarefas">
        <h2>Tarefas</h2>
        <ul>
            <li>
                <span>Tarefa 1</span>
                <button>Remover</button>
            </li>
        </ul>
    </div>

    <script src="srcindex.js"></script>
</body>
</html>
